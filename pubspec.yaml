name: datomworld_cljd
description: ClojureDart experiment for Datomworld
publish_to: 'none'
environment:
  # cbor 6.5.1 (the dao.stream.cbor Dart codec) requires >=3.7.0.
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_gpu:
    sdk: flutter
  http: ^1.2.0
  cbor: 6.5.1
  crypto: 3.0.7
  # The :cljd NFC seam (yin.vm.debruijn's normalize-nfc). Pinned to the
  # Unicode 16.0 release the de Bruijn projection design settled on
  # 2026-09-21; 0.3.2 moved to Unicode 17.0.
  unorm_dart: 0.3.1+1
  # The generated Python3 ANTLR parser (antlr/python3/manifest.edn) runs on
  # this runtime; one release with the ANTLR tool in deps.edn :antlr-gen.
  antlr4: 4.13.2
  # DaoJing multihash content-addressing (BLAKE3).
  blake3_dart: 1.0.0
  ed25519_edwards: 0.3.2
  # The dao.stream.ble dart seam (docs/design/dao.stream.ble.md 8): the
  # central role and the peripheral role of one BLE radio node. Both
  # pinned exact and both BSD-3: flutter_blue_plus 2.x changed to a
  # license that is not free for for-profit use, and this repository is
  # GPL-2.0-only with a linking exception.
  flutter_blue_plus: 1.36.8
  flutter_ble_peripheral: 3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.29.0

flutter:
  assets:
    - assets/shaders/simple_mesh.shaderbundle
    - assets/images/earth_land_ocean_ice_2048.jpg
    - assets/images/moon_texture_1024.jpg
    - assets/images/earth_land_ocean_ice_1024.jpg
    - assets/images/moon_texture_512.jpg
