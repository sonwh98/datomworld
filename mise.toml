[tools]
java = ["21", "17"]
cljstyle = "0.17.642"
zprint = "1.3.0"
babashka = "1.13.225"
clojure = "1.12.4.1602"
node = "25.6.1"
# jolt host lane (jolt-toolchain.edn): exact pins, never "latest"; a change of
# any of them goes through the jolt upgrade gate
chezscheme = "10.4.1"
# gambit is not in mise's registry; the asdf plugin joeljuca/asdf-gambit builds
# the v4.9.8 tag from source (pre-generated C in the tag archive, so no
# gambit bootstrap step) — the same from-source 4.9.8 jolt's CI gates target
# (Makefile GAMBIT_PREFIX comment; tests.yml). Plugin pinned to its full HEAD
# SHA (mise rejects abbreviated ones). Never "latest".
# Known divergence (review 1794970000000 P2-1): the plugin configures with
# --enable-single-host only; jolt CI (tests.yml) additionally passes
# --enable-default-runtime-options=f8,-8,t8. Gates pass with the plugin build;
# revisit at the upgrade gate if a gate ever disagrees.
# Fresh installs run a ~15-20 min from-source build including the plugin's
# `make check` (review P2-2); Linux verified once before this pin landed.
# [plugins] must stay the LAST table in this file — a mid-file table broke
# mise's validation of the flutter entry (engineer findings 1794934400000).
gambit = "4.9.8"
# guile (jolt host lane, third Scheme target, Phase 1 of the Guile port):
# not in mise's registry; the mise-plugins org asdf plugin builds the GPG-
# verified 3.0.11 tarball from ftp.gnu.org from source, pinned to its full
# HEAD SHA. Never "latest"; 3.0.9 does not build against libgc 8.2.x (probe
# 1794971000000). Fresh installs are a 15-25 min serial build.
# darwin-arm64 needs the [env] overrides below: the macOS 26 SDK declares
# pipe2 a macOS 27 symbol, configure detects it, and libguile's gnulib
# rpl_pipe2 calls it through a weak import that is NULL on a macOS 26
# runtime — segfault at scm_i_init_guile (the 2026-11-27 mise probe crash,
# crash report guile-2026-11-27-172143.ips). ac_cv_func_pipe2=no selects
# gnulib's pipe()+fcntl fallback and is the fix. macOS brew prerequisites:
# pkg-config gmp libunistring libffi bdw-gc readline (docs/agents/
# build-n-test.md). Linux renders the [env] overrides empty and needs none
# of them (real pipe2; Debian packages in jolt-toolchain.edn :os-packages).
guile = "3.0.11"
cmake = "4.4.4"
android-sdk = "latest"
flutter = { version = "3.47.8", platforms = """
[linux-x64]
url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/linux/flutter_linux_{{ version }}-beta.tar.xz"

[macos-arm64]
url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/macos/flutter_macos_arm64_{{ version }}-beta.zip"

[macos-x64]
url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/macos/flutter_macos_{{ version }}-beta.zip"

[windows-x64]
url = "https://storage.googleapis.com/flutter_infra_release/releases/beta/windows/flutter_windows_{{ version }}-beta.zip"
""", version_json_path = ".releases[?channel=beta].version", version_list_url = "https://storage.googleapis.com/flutter_infra_release/releases/releases_macos.json" }

[env._]
path = [
  "{{env.HOME}}/.local/share/mise/installs/android-sdk/1.0/platform-tools",
  "{{env.HOME}}/.local/share/mise/installs/android-sdk/1.0/emulator",
]

[env]
#FLUTTER_STORAGE_BASE_URL = "https://storage.flutter-io.cn"
#PUB_HOSTED_URL = "https://pub.flutter-io.cn"
# Guile source-build variables, consumed by the mise-guile plugin's
# ./configure (verified 2026-11-27: [env] reaches plugin install scripts,
# plain values and tera templates both). macOS-only; on Linux every value
# renders to the empty string and configure uses pkg-config plus the real
# pipe2. ac_cv_func_pipe2=no is the darwin-arm64 crash fix described at the
# guile pin above. FFI_* point at the SDK's system libffi (the same
# /usr/lib/libffi.dylib Homebrew's own guile links), configure's pkg-config
# probe does not find Homebrew's keg-only bdw-gc so BDW_GC_* supply its
# paths, and the rpath covers the brew lib dir for build-tree binaries
# during the stage0 bootstrap.
GUILE_CONFIG_OPTIONS = '{% if os() == "macos" %}--disable-nls --with-libgmp-prefix=/opt/homebrew/opt/gmp --with-libunistring-prefix=/opt/homebrew/opt/libunistring --with-libreadline-prefix=/opt/homebrew/opt/readline ac_cv_func_pipe2=no{% endif %}'
FFI_CFLAGS = '{% if os() == "macos" %}-I{{ exec(command="xcrun --show-sdk-path") }}/usr/include/ffi{% endif %}'
FFI_LIBS = '{% if os() == "macos" %}-lffi{% endif %}'
BDW_GC_CFLAGS = '{% if os() == "macos" %}-I/opt/homebrew/opt/bdw-gc/include{% endif %}'
BDW_GC_LIBS = '{% if os() == "macos" %}-L/opt/homebrew/opt/bdw-gc/lib -lgc{% endif %}'
LDFLAGS = '{% if os() == "macos" %}-Wl,-rpath,/opt/homebrew/lib{% endif %}'

[plugins]
gambit = "https://github.com/joeljuca/asdf-gambit#b8a901e7af845c8b0a0ee1adc5b67687ba4c582b"
guile = "https://github.com/mise-plugins/mise-guile#fc5bbf3e48f5ae76045b99d99c096cf72d8db20a"
